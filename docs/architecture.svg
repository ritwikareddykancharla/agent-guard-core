<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0e1a2b"/>
    </marker>
    <marker id="arr-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6433"/>
    </marker>
  </defs>
  <rect width="1120" height="480" fill="#f2f5fa"/>
  <rect x="16" y="16" width="1088" height="448" fill="#ffffff" stroke="#0e1a2b" stroke-width="1.5"/>

  <rect x="40" y="38" width="190" height="22" fill="#9f1239"/>
  <text x="135" y="53" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#ffffff" letter-spacing="1.2">AGENTGUARD ARCHITECTURE</text>
  <text x="40" y="86" font-size="21" font-weight="800" fill="#0e1a2b">AWS CloudFront + Private S3 OAC + VPC PII Firewall + Bedrock Nova</text>
  <text x="40" y="106" font-family="monospace" font-size="11.5" fill="#6b7a92">Distribution E3PN6VHSQN4P1T · S3 OAC SigV4 · Lambda /api/* (us-west-2) · us.amazon.nova-lite-v1:0</text>

  <!-- CloudFront -->
  <rect x="40" y="148" width="205" height="250" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
  <text x="142" y="174" text-anchor="middle" font-family="monospace" font-size="10" fill="#35527e">GLOBAL EDGE CDN</text>
  <text x="142" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#0e1a2b">Amazon CloudFront</text>
  <rect x="56" y="216" width="173" height="72" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1"/>
  <text x="142" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e1a2b">Behavior 1: Default (*)</text>
  <text x="142" y="256" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">Private S3 via OAC SigV4</text>
  <text x="142" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7a92">BlockPublicAccess = TRUE</text>

  <rect x="56" y="302" width="173" height="78" fill="#f2f5fa" stroke="#0e1a2b" stroke-width="1"/>
  <text x="142" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e1a2b">Behavior 2: /api/*</text>
  <text x="142" y="342" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#9f1239">agentguard-api-origin</text>
  <text x="142" y="358" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7a92">CachingDisabled · No-Store</text>

  <!-- Gate 1 & 2 -->
  <rect x="295" y="148" width="245" height="114" fill="#0e1a2b" stroke="#0e1a2b" stroke-width="1.5"/>
  <text x="417" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#8fb0e6">GATE 01 &amp; 02 · VPC EGRESS</text>
  <text x="417" y="194" text-anchor="middle" font-size="15.5" font-weight="800" fill="#ffffff">PII Vault &amp; Injection Filter</text>
  <text x="417" y="216" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#d6e0f5">360/360 SSN/Key -&gt; [PII_SSN_1]</text>
  <text x="417" y="236" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ff8a5c">40/40 RAG Overrides Quarantined</text>

  <!-- Gate 4 -->
  <rect x="295" y="284" width="245" height="114" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
  <text x="417" y="308" text-anchor="middle" font-family="monospace" font-size="10" fill="#35527e">GATE 04 · ZERO-TRUST AUTH</text>
  <text x="417" y="330" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0e1a2b">Scoped HMAC-SHA256 &amp; JIT</text>
  <text x="417" y="352" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#33425a">23/23 Confused-Deputy Blocked</text>
  <text x="417" y="370" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">SHA-256 Hash-Chained Audit Log</text>

  <!-- Gate 3 -->
  <rect x="590" y="148" width="215" height="114" fill="#ffffff" stroke="#35527e" stroke-width="2"/>
  <text x="697" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#35527e">GATE 03 · MODEL GATEWAY</text>
  <text x="697" y="194" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0e1a2b">Semantic Cache &amp; Router</text>
  <text x="697" y="216" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#33425a">920.0 ms -&gt; 86.8 ms (-90.6%)</text>
  <text x="697" y="236" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">-89.6% Inference Spend</text>

  <!-- Posture Auto-Patcher -->
  <rect x="590" y="284" width="215" height="114" fill="#ffffff" stroke="#0e1a2b" stroke-width="1.5"/>
  <text x="697" y="308" text-anchor="middle" font-family="monospace" font-size="10" fill="#9f1239">SECURITY AUTOMATION</text>
  <text x="697" y="330" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0e1a2b">Posture Auto-Patcher</text>
  <text x="697" y="352" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#33425a">6 Microservice Controls</text>
  <text x="697" y="370" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0c8a4d">Unified Diff (24 -&gt; 100/100)</text>

  <!-- Bedrock -->
  <rect x="855" y="185" width="225" height="168" fill="#9f1239" stroke="#0e1a2b" stroke-width="1.5"/>
  <text x="967" y="214" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffe4e6">AMAZON BEDROCK (US-WEST-2)</text>
  <text x="967" y="240" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">nova-lite-v1:0</text>
  <text x="967" y="266" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">• Sees &lt;PII:...&gt; Tokens Only</text>
  <text x="967" y="288" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">• Synthesizes Remediation</text>
  <text x="967" y="308" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">• Scoped IAM Converse Role</text>

  <!-- Arrows -->
  <path d="M245 215L293 205" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#arr-ink)"/>
  <path d="M245 340L293 340" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#arr-ink)"/>
  <path d="M540 205H588" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#arr-ink)"/>
  <path d="M805 205L853 245" stroke="#0e1a2b" stroke-width="1.8" fill="none" marker-end="url(#arr-ink)"/>
  <path d="M805 340L853 300" stroke="#ff6433" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#arr-sig)"/>
</svg>
