<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif">
  <rect width="1160" height="580" rx="14" fill="#f8fafc"/>
  <text x="36" y="42" font-size="20" font-weight="800" fill="#0f172a">AgentGuard — AWS CloudFront + VPC PII Firewall + Scoped A2A Auth + Bedrock Auto-Patcher</text>
  <text x="36" y="65" font-size="13" fill="#475569">Zero-Trust AI Security Control Plane · Origin Access Control (OAC) · HMAC-SHA256 Delegation · Amazon Bedrock (us.amazon.nova-lite-v1:0)</text>

  <!-- Caller / Red-Team Lab -->
  <rect x="30" y="150" width="175" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="117" y="184" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Enterprise &amp; SecOps</text>
  <text x="117" y="207" text-anchor="middle" font-size="11.5" fill="#475569">• Customer Support Prompts</text>
  <text x="117" y="227" text-anchor="middle" font-size="11.5" fill="#475569">• Untrusted RAG Documents</text>
  <text x="117" y="247" text-anchor="middle" font-size="11.5" fill="#475569">• Delegated Sub-Agents</text>
  <text x="117" y="267" text-anchor="middle" font-size="11.5" fill="#475569">• Microservice Posture Specs</text>
  <rect x="46" y="294" width="142" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="117" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Single HTTPS Origin</text>
  <text x="117" y="336" text-anchor="middle" font-size="10.5" fill="#1e40af">dxxxx.cloudfront.net</text>
  <text x="117" y="354" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">TLS 1.3 · Zero CORS</text>

  <!-- CloudFront Edge -->
  <rect x="242" y="120" width="215" height="315" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="349" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Amazon CloudFront CDN</text>
  <text x="349" y="171" text-anchor="middle" font-size="11" fill="#4338ca">Global Edge · HTTP/3 · OAC SigV4</text>

  <rect x="260" y="192" width="180" height="94" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="350" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">Origin 1: Default (*)</text>
  <text x="350" y="236" text-anchor="middle" font-size="11" fill="#475569">Security Control Plane SPA</text>
  <text x="350" y="255" text-anchor="middle" font-size="10.5" fill="#059669" font-weight="700">Origin Access Control (OAC)</text>
  <text x="350" y="272" text-anchor="middle" font-size="10" fill="#64748b">CachingOptimized</text>

  <rect x="260" y="304" width="180" height="106" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="350" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">Origin 2: /api/*</text>
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#475569">agentguard-api-origin</text>
  <text x="350" y="367" text-anchor="middle" font-size="10.5" fill="#dc2626" font-weight="700">CachingDisabled · No-Store</text>
  <text x="350" y="385" text-anchor="middle" font-size="10" fill="#64748b">AllViewerExceptHostHeader</text>

  <!-- Private S3 Bucket -->
  <rect x="502" y="92" width="295" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="649" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">Amazon S3 (Private Web Bucket)</text>
  <text x="649" y="142" text-anchor="middle" font-size="11" fill="#047857">agentguard-web-796330847946-us-west-2</text>
  <text x="649" y="161" text-anchor="middle" font-size="11" fill="#065f46">• BlockPublicAccess = TRUE (4/4 flags)</text>
  <text x="649" y="179" text-anchor="middle" font-size="11" fill="#065f46">• Bucket Policy Pinned to CloudFront SourceArn</text>

  <!-- AgentGuard Core Security Pipeline (Lambda us-west-2) -->
  <rect x="502" y="216" width="310" height="330" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="657" y="245" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">AgentGuard VPC Security Engine (us-west-2)</text>

  <rect x="520" y="262" width="274" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="657" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Gate 1 &amp; 2: VPC PII Vault + Injection Firewall</text>
  <text x="657" y="300" text-anchor="middle" font-size="10.5" fill="#334155">SSN/Email/AWS_Key -&gt; [PII_SSN_1] (360/360)</text>
  <text x="657" y="314" text-anchor="middle" font-size="10.5" fill="#b91c1c" font-weight="700">40/40 Indirect Prompt Injections Quarantined</text>

  <rect x="520" y="332" width="274" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="657" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Gate 3: Tenant-Isolated Semantic Cache</text>
  <text x="657" y="370" text-anchor="middle" font-size="10.5" fill="#334155">3-Gram + TF-IDF Cosine · Token Bucket Quota</text>
  <text x="657" y="384" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-weight="700">920 ms -&gt; 86.8 ms (-89.6% Inference Spend)</text>

  <rect x="520" y="402" width="274" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="657" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Gate 4: Scoped HMAC-SHA256 A2A &amp; JIT Proxy</text>
  <text x="657" y="440" text-anchor="middle" font-size="10.5" fill="#334155">Monotonic Tool/ARN Attenuation · Selective PII</text>
  <text x="657" y="454" text-anchor="middle" font-size="10.5" fill="#b45309" font-weight="700">23/23 Confused-Deputy Escalations Rejected</text>

  <rect x="520" y="472" width="274" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="657" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Service Security Posture Auto-Patcher</text>
  <text x="657" y="510" text-anchor="middle" font-size="10.5" fill="#334155">6 Zero-Trust Controls · Unified Diff · 24 -&gt; 100/100</text>

  <!-- Right Tier: Bedrock + Hash-Chained Audit Ledger -->
  <rect x="862" y="196" width="268" height="152" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="996" y="226" text-anchor="middle" font-size="14.5" font-weight="800" fill="#5b21b6">Amazon Bedrock</text>
  <text x="996" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">us.amazon.nova-lite-v1:0</text>
  <text x="996" y="269" text-anchor="middle" font-size="11" fill="#4c1d95">• Sees ONLY Redacted &lt;PII:...&gt; Tokens</text>
  <text x="996" y="289" text-anchor="middle" font-size="11" fill="#4c1d95">• Synthesizes Security Posture</text>
  <text x="996" y="307" text-anchor="middle" font-size="11" fill="#4c1d95">  Remediation &amp; Least-Privilege Diffs</text>
  <text x="996" y="327" text-anchor="middle" font-size="10.5" fill="#059669" font-weight="700">• Scoped IAM Converse Role</text>

  <rect x="862" y="376" width="268" height="148" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="996" y="406" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Attribution &amp; JIT Governance</text>
  <text x="996" y="428" text-anchor="middle" font-size="11" fill="#334155">• SHA-256 Hash-Chained Audit Log</text>
  <text x="996" y="448" text-anchor="middle" font-size="11" fill="#334155">• 3-Way Attribution (Human/Agent/JIT)</text>
  <text x="996" y="468" text-anchor="middle" font-size="11" fill="#334155">• Human Sign-Off for WIRE / IAM_MUTATE</text>
  <text x="996" y="488" text-anchor="middle" font-size="11" fill="#334155">• 3-Tier Hierarchical Session Memory</text>

  <!-- Connectors -->
  <line x1="205" y1="275" x2="242" y2="275" stroke="#475569" stroke-width="2.5"/>
  <line x1="440" y1="238" x2="502" y2="146" stroke="#10b981" stroke-width="2.5"/>
  <line x1="440" y1="356" x2="502" y2="356" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="812" y1="356" x2="862" y2="275" stroke="#8b5cf6" stroke-width="2.5"/>
